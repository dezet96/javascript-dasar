<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Pembelajaran Pemrograman Dasar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); min-height: 100vh; }
    .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    .glass-card { background: rgba(255,255,255,0.07); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.12); }
    .btn-primary { background: linear-gradient(135deg, #0ea5e9, #06b6d4); transition: all 0.3s ease; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(14,165,233,0.4); }
    .btn-success { background: linear-gradient(135deg, #10b981, #059669); transition: all 0.3s ease; }
    .btn-success:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(16,185,129,0.4); }
    .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); transition: all 0.3s ease; }
    .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(239,68,68,0.4); }
    .topic-card { transition: all 0.3s ease; }
    .topic-card:hover:not(.locked) { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
    .locked { opacity: 0.5; cursor: not-allowed; }
    .code-block { background: #1e1e2e; border-radius: 12px; overflow: hidden; }
    .fade-in { animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .slide-in { animation: slideIn 0.4s ease; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
    .pulse-glow { animation: pulseGlow 2s infinite; }
    @keyframes pulseGlow { 0%,100% { box-shadow: 0 0 20px rgba(14,165,233,0.3); } 50% { box-shadow: 0 0 40px rgba(14,165,233,0.6); } }
    .confetti { position: fixed; width: 10px; height: 10px; animation: confettiFall 3s linear forwards; z-index: 9999; }
    @keyframes confettiFall { 0% { transform: translateY(-100px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
    .progress-bar-fill { transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
    .option-btn { transition: all 0.2s ease; }
    .option-btn:hover:not(.disabled) { transform: scale(1.02); }
    .toast { animation: toastSlide 0.4s ease; }
    @keyframes toastSlide { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .shake { animation: shake 0.5s ease; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
    .checkmark { animation: checkmarkPop 0.5s ease; }
    @keyframes checkmarkPop { 0% { transform: scale(0); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
    .hljs { background: #1e1e2e !important; padding: 20px !important; border-radius: 12px; font-size: 14px; line-height: 1.7; }
    .tab-btn { transition: all 0.3s ease; }
    .tab-btn.active { background: rgba(14,165,233,0.2); color: #38bdf8; border-color: #38bdf8; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
    ::-webkit-scrollbar-thumb { background: rgba(14,165,233,0.5); border-radius: 4px; }
    .star { animation: starTwinkle 1.5s ease-in-out infinite; }
    @keyframes starTwinkle { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } }
  </style>
</head>

    { tipe: 'pg', pertanyaan: 'Operator mana yang menghasilkan <code>true</code> jika KEDUA kondisi bernilai true?', opsi: ['||', '&&', '!', '=='], jawaban: 1, penjelasan: '&& (AND) hanya true jika kedua sisi true.' },
    { tipe: 'output', pertanyaan: 'Perhatikan kode berikut:<br><pre class="mt-2"><code class="language-javascript">let a = 10;\na += 5;\na *= 2;\nconsole.log(a);</code></pre><br>Apa outputnya?', opsi: ['20', '25', '30', '35'], jawaban: 2, penjelasan: 'a = 10, lalu a += 5 jadi 15, lalu a *= 2 jadi 30.' },
    { tipe: 'lengkapi', pertanyaan: 'Lengkapi kondisi untuk menetapkan lulus jika nilai minimal 75 (nilai 75 juga harus lulus):<br><pre class="mt-2"><code class="language-javascript">let nilai = 75;\nlet lulus = nilai ___ 75;</code></pre>', opsi: ['>=', '>', '!==', '<'], jawaban: 0, penjelasan: 'Operator >= berarti lebih besar atau sama dengan. Dengan nilai 75, kondisi ini bernilai true; operator > tidak menyertakan nilai yang sama dengan batas.' },

    { tipe: 'output', pertanyaan: '<pre class="mt-2"><code class="language-javascript">let a = true;\nlet b = false;\nconsole.log(a || b && !b);</code></pre><br>Apa outputnya?', opsi: ['true', 'false', 'undefined', '1'], jawaban: 0, penjelasan: 'Operator && dievaluasi dulu: b && !b = false && true = false. Lalu a || false = true || false = true.' }

  2: [

    { tipe: 'output', pertanyaan: '<pre class="mt-2"><code class="language-javascript">let nilai = 75;\nif (nilai >= 80) {\n  console.log("A");\n} else if (nilai >= 70) {\n  console.log("B");\n} else {\n  console.log("C");\n}</code></pre><br>Apa outputnya?', opsi: ['A', 'B', 'C', 'Error'], jawaban: 1, penjelasan: '75 >= 80 adalah false, tapi 75 >= 70 adalah true, jadi output "B".' },
    { tipe: 'lengkapi', pertanyaan: 'Lengkapi kode untuk mengecek apakah siswa lulus (nilai >= 60):<br><pre class="mt-2"><code class="language-javascript">let nilai = 60;\nif (nilai ___ 60) {\n  console.log("Lulus");\n}</code></pre>', opsi: ['<', '>', '>=', '!=='], jawaban: 2, penjelasan: '>= 60 artinya nilai lebih besar atau sama dengan 60. Karena nilainya tepat 60, hanya >= yang membuat kondisi ini true.' },

    { tipe: 'lengkapi', pertanyaan: 'Lengkapi kode untuk mengecek bilangan genap/ganjil:<br><pre class="mt-2"><code class="language-javascript">let angka = 7;\nif (angka ___ 2 === 0) {\n  console.log("Genap");\n} else {\n  console.log("Ganjil");\n}</code></pre>', opsi: ['/', '*', '%', '+'], jawaban: 2, penjelasan: '% 2 menghitung sisa bagi dengan 2. Jika sisa 0, berarti genap.' },

// STATE MANAGEMENT
// =====================================================

let appState = {
  page: 'landing', // landing, dashboard, topic, result
  user: null,
  progress: {}, // { topicId: { completed: bool, correct: int, total: int, attempts: int, score: int } }
  currentTopic: null,
  currentQuestions: [],
  currentAnswers: [],
  currentQuestionIndex: 0,
  currentAttempt: 1, // attempt count for current topic session
  activeTab: 'pengantar',
  draftCode: {}
};

const STORAGE_KEY = 'mediaPembelajaranPD';

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return;
    const data = JSON.parse(saved);
    appState.user = data.user || null;
    appState.progress = data.progress && typeof data.progress === 'object' ? data.progress : {};
    appState.currentTopic = Number.isInteger(data.currentTopic) ? data.currentTopic : null;
    appState.currentQuestions = Array.isArray(data.currentQuestions) ? data.currentQuestions : [];
    appState.currentAnswers = Array.isArray(data.currentAnswers) ? data.currentAnswers : [];
    appState.currentQuestionIndex = Number.isInteger(data.currentQuestionIndex) ? data.currentQuestionIndex : 0;
    appState.currentAttempt = Number.isInteger(data.currentAttempt) && data.currentAttempt > 0 ? data.currentAttempt : 1;
    appState.activeTab = ['pengantar', 'studi', 'latihan'].includes(data.activeTab) ? data.activeTab : 'pengantar';
    appState.draftCode = data.draftCode && typeof data.draftCode === 'object' ? data.draftCode : {};

    // Resume the previous screen when a student reloads or reopens the hosted page.
    if (appState.user && ['dashboard', 'topic', 'result'].includes(data.page)) {
      appState.page = data.page;
    }
    // Recover safely if a saved topic session is incomplete or outdated.
    if (appState.page === 'topic' && (!materiTopik[appState.currentTopic] || appState.currentQuestions.length !== 3 || appState.currentAnswers.length !== 3)) {
      appState.page = 'dashboard';
      appState.currentTopic = null;
      appState.currentQuestions = [];
      appState.currentAnswers = [];
      appState.currentQuestionIndex = 0;
      appState.activeTab = 'pengantar';
    }
    appState.currentQuestionIndex = Math.max(0, Math.min(2, appState.currentQuestionIndex));
  } catch (error) {
    console.warn('Progress belajar tidak dapat dibaca; memulai dengan sesi baru.', error);
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      user: appState.user,
      progress: appState.progress,
      page: appState.page,
      currentTopic: appState.currentTopic,
      currentQuestions: appState.currentQuestions,
      currentAnswers: appState.currentAnswers,
      currentQuestionIndex: appState.currentQuestionIndex,
      currentAttempt: appState.currentAttempt,
      activeTab: appState.activeTab,
      draftCode: appState.draftCode
    }));
    return true;
  } catch (error) {
    console.warn('Progress belajar belum bisa disimpan di browser ini.', error);
    return false;
  }
}

function shuffleArray(arr) {
  const shuffled = [...arr];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

function getRandomQuestions(topicId) {
  const bank = bankSoal[topicId];
  const shuffled = shuffleArray(bank);
  return shuffled.slice(0, 3).map(q => {
    // Shuffle options and track correct answer
    const originalOpsi = [...q.opsi];
    const correctText = originalOpsi[q.jawaban];
    const shuffledOpsi = shuffleArray(originalOpsi);
    const newJawaban = shuffledOpsi.indexOf(correctText);
    return { ...q, opsi: shuffledOpsi, jawaban: newJawaban };
  });
}

function getUnlockedTopics() {
  let unlocked = [1];
  for (let i = 1; i < 9; i++) {
    if (appState.progress[i] && appState.progress[i].completed) {

function getCompletedCount() {

// =====================================================
// FUNGSI PENILAIAN KODING
// =====================================================

/**
 * Menilai kode siswa berdasarkan rubrik per topik.
 * Komponen penilaian:
 *  - Output (50%): apakah output sesuai expected
 *  - Konsep (30%): apakah keyword konsep yang diajarkan dipakai
 *  - Anti-hardcode (20%): apakah siswa tidak sekadar console.log literal
 */
function nilaiKoding(topicId, code, logs) {
  const rubrik = rubrikKoding[topicId];
  if (!rubrik) {
    return { total: 0, output: 0, konsep: 0, kualitas: 0, catatan: ['Rubrik tidak ditemukan.'], lulus: false };
  }

  const skor = { output: 0, konsep: 0, kualitas: 0, total: 0, catatan: [], lulus: false };

  // --- 1. Cek output (50 poin) ---
  const actual = logs.filter(l => !l.startsWith('[ERROR]') && !l.startsWith('[WARN]'));
  const outputCocok = rubrik.expected.length === actual.length &&
                      rubrik.expected.every((exp, i) => actual[i] === exp);
  if (outputCocok) {
    skor.output = 50;
    skor.catatan.push({ status: 'ok', pesan: 'Output sesuai dengan yang diharapkan.' });
  } else {
    skor.catatan.push({ status: 'fail', pesan: 'Output belum sesuai.' });
  }

  // --- 2. Cek konsep (30 poin) ---
  const konsepDipakai = rubrik.wajibKata.every(k => code.includes(k));
  if (konsepDipakai) {
    skor.konsep = 30;
    skor.catatan.push({ status: 'ok', pesan: 'Konsep yang diajarkan sudah dipakai: ' + rubrik.wajibKata.join(', ') });
  } else {
    const hilang = rubrik.wajibKata.filter(k => !code.includes(k));
    skor.catatan.push({ status: 'warn', pesan: 'Konsep belum dipakai: ' + hilang.join(', ') + '. ' + rubrik.saran });
  }

  // --- 3. Anti-hardcode (20 poin) ---
  let hardcode = false;
  if (rubrik.laranganHardcode) {
    // Deteksi jika siswa hanya menulis console.log("...") dengan string literal yang sama dengan expected
    for (const exp of rubrik.expected) {
      const literalPattern = new RegExp('console\\.log\\s*\\(\\s*[\'"`]' + escapeRegExp(exp) + '[\'"`]\\s*\\)');
      if (literalPattern.test(code)) {
        hardcode = true;
        break;
      }
    }
  }
  if (!hardcode) {
    skor.kualitas = 20;
    skor.catatan.push({ status: 'ok', pesan: 'Tidak terdeteksi hardcode output.' });
  } else {
    skor.catatan.push({ status: 'fail', pesan: 'Terdeteksi hardcode: kamu hanya menulis console.log dengan string literal, bukan menghitung nilai.' });
  }

  skor.total = skor.output + skor.konsep + skor.kualitas;
  skor.lulus = skor.total >= 70; // minimal 70 untuk lulus tantangan koding
  return skor;
}

function escapeRegExp(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function getAttemptBasePoints(attempt) {
  return Math.max(10, 100 - (Math.max(1, attempt) - 1) * 25);
}

function recordAttemptIfComplete() {
  if (!appState.currentAnswers || appState.currentAnswers.length !== 3 || appState.currentAnswers.some(a => a === null)) return;
  const topicId = appState.currentTopic;
  const previous = appState.progress[topicId] || { completed: false, attempts: 0, attemptHistory: [] };
  const history = Array.isArray(previous.attemptHistory) ? previous.attemptHistory : [];
  if (history.some(item => item.attempt === appState.currentAttempt)) return;

  const correctCount = appState.currentAnswers.filter(a => a.correct).length;
  const wrongCount = 3 - correctCount;
  const score = Math.max(0, getAttemptBasePoints(appState.currentAttempt) - wrongCount * 20);
  const answerDetails = appState.currentAnswers.map((a, i) => {
    const q = appState.currentQuestions[i];
    return {
      question: q.pertanyaan.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim(),
      selected: q.opsi[a.selected],
      correctAnswer: q.opsi[q.jawaban],
      correct: !!a.correct
    };
  });
  history.push({ attempt: appState.currentAttempt, correct: correctCount, wrong: wrongCount, score, answers: answerDetails, date: new Date().toISOString() });
  appState.progress[topicId] = {
    ...previous,
    completed: !!previous.completed,
    correct: correctCount,
    wrong: wrongCount,
    total: 3,
    attempts: appState.currentAttempt,
    score,
    attemptHistory: history
  };
  saveState();
}

}

function renderQuizContent() {
  const idx = appState.currentQuestionIndex;
  const q = appState.currentQuestions[idx];
  const ans = appState.currentAnswers[idx];
  const totalAnswered = appState.currentAnswers.filter(a => a !== null).length;
  const allAnswered = totalAnswered === 3;
  const allCorrect = allAnswered && appState.currentAnswers.every(a => a.correct);
  
  if (allAnswered) {
    const correctCount = appState.currentAnswers.filter(a => a.correct).length;
    const isPass = correctCount === 3;
    const attempt = appState.currentAttempt;
    const points = Math.max(0, getAttemptBasePoints(attempt) - (3 - correctCount) * 20);
    const topicProgress = appState.progress[appState.currentTopic] || {};
    const attemptHistory = Array.isArray(topicProgress.attemptHistory) ? topicProgress.attemptHistory : [];
    const totalWrongThisAttempt = 3 - correctCount;
    
    return `
      <div class="glass-card rounded-2xl p-6 md:p-8 text-center fade-in">
        <div class="text-6xl mb-4">${isPass ? '🎉' : '😅'}</div>
        <h3 class="text-2xl font-bold text-white mb-2">${isPass ? 'Mantap! Semua Benar!' : 'Ada yang Salah Nih'}</h3>
        <p class="text-slate-400 mb-4">Kamu menjawab ${correctCount} dari 3 soal dengan benar.</p>
        
        <div class="bg-amber-500/10 border border-amber-500/20 rounded-xl p-4 mb-6">
          <p class="text-amber-400 text-sm font-medium">🏆 Percobaan ke-${attempt} — Nilai percobaan ini: <span class="text-2xl font-bold">${points}</span> / 100</p>
          <p class="text-slate-300 text-sm mt-1">Benar: ${correctCount} soal · Salah: ${totalWrongThisAttempt} soal · Total percobaan: ${attemptHistory.length || attempt}</p>
          <p class="text-slate-400 text-xs mt-1">Nilai awal turun 25 poin setiap percobaan ulang, dan setiap jawaban salah mengurangi 20 poin.</p>
        </div>
        
        <div class="space-y-3 mb-6 text-left">
          ${appState.currentAnswers.map((a, i) => `
            <div class="flex items-center gap-3 p-3 rounded-xl ${a.correct ? 'bg-emerald-500/10 border border-emerald-500/20' : 'bg-rose-500/10 border border-rose-500/20'}">
              <span class="text-2xl">${a.correct ? '✅' : '❌'}</span>
              <div>
                <p class="text-sm font-medium ${a.correct ? 'text-emerald-400' : 'text-rose-400'}">Soal ${i + 1}</p>
                <p class="text-slate-400 text-xs">${a.correct ? 'Jawaban benar!' : 'Jawaban salah. ' + a.penjelasan}</p>
              </div>
            </div>
          `).join('')}
        </div>
        
        ${isPass ? `
          <button id="btnComplete" class="btn-success py-4 px-8 rounded-xl font-bold text-white text-lg">
            🚀 Lanjut ke Topik Berikutnya
          </button>
        ` : `
          <div class="bg-slate-800/50 rounded-xl p-4 mb-4">
            <p class="text-slate-400 text-sm">💡 Jika mencoba lagi, soal diacak ulang. Nilai dasar percobaan berikutnya: ${getAttemptBasePoints(attempt + 1)} poin, lalu setiap jawaban salah mengurangi 20 poin.</p>
          </div>
          <button id="btnRetry" class="btn-primary py-4 px-8 rounded-xl font-bold text-white text-lg">
            🔄 Coba Lagi (Soal Diacak)
          </button>
        `}
      </div>
    `;
  }
  
  const labels = ['A', 'B', 'C', 'D'];
  const isAnswered = ans !== null;
  const attempt = appState.currentAttempt;
  const maxPoints = attempt === 1 ? 100 : attempt === 2 ? 50 : attempt === 3 ? 25 : 10;
  
  return `
    <div class="fade-in">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          ${[0, 1, 2].map(i => `
            <div class="w-8 h-2 rounded-full ${i < idx ? 'bg-emerald-500' : i === idx ? 'bg-sky-500' : 'bg-slate-700'}"></div>
          `).join('')}
        </div>
        <div class="text-right">
          <span class="text-xs text-slate-400">Percobaan ke-${attempt}</span>
          <span class="text-xs text-amber-400 font-bold ml-2">🏆 ${maxPoints} poin</span>
        </div>
      </div>
      <p class="text-slate-400 text-sm mb-4">Soal ${idx + 1} dari 3</p>
      
      <div class="glass-card rounded-2xl p-6 md:p-8 mb-4">
        <div class="mb-2">
          <span class="inline-block px-3 py-1 rounded-lg text-xs font-semibold ${q.tipe === 'pg' ? 'bg-purple-500/20 text-purple-400' : q.tipe === 'output' ? 'bg-orange-500/20 text-orange-400' : 'bg-sky-500/20 text-sky-400'}">
            ${q.tipe === 'pg' ? 'Pilihan Ganda' : q.tipe === 'output' ? 'Tentukan Output' : 'Lengkapi Kode'}
          </span>
        </div>
        <div class="text-lg text-white mb-6 leading-relaxed">${q.pertanyaan}</div>
        
        <div class="space-y-3">
          ${q.opsi.map((opt, i) => {
            let btnClass = 'option-btn w-full text-left p-4 rounded-xl border transition-all ';
            if (!isAnswered) {
              btnClass += 'bg-slate-800/50 border-slate-600 hover:border-sky-500 hover:bg-sky-500/10 text-slate-300';
            } else if (i === q.jawaban) {
              btnClass += 'bg-emerald-500/20 border-emerald-500 text-emerald-400';
            } else if (i === ans.selected && !ans.correct) {
              btnClass += 'bg-rose-500/20 border-rose-500 text-rose-400';
            } else {
              btnClass += 'bg-slate-800/30 border-slate-700 text-slate-500';
            }
            return `
              <button class="${btnClass} ${isAnswered ? 'disabled cursor-default' : 'cursor-pointer'}" data-opt="${i}" ${isAnswered ? 'disabled' : ''}>
                <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-slate-700 text-sm font-bold mr-3 ${isAnswered && i === q.jawaban ? 'bg-emerald-500 text-white' : isAnswered && i === ans?.selected && !ans?.correct ? 'bg-rose-500 text-white' : ''}">${labels[i]}</span>
                <span class="font-mono text-sm">${opt}</span>
                ${isAnswered && i === q.jawaban ? '<span class="ml-auto text-emerald-400">✓ Benar</span>' : ''}
                ${isAnswered && i === ans?.selected && !ans?.correct ? '<span class="ml-auto text-rose-400">✗ Salah</span>' : ''}
              </button>
            `;
          }).join('')}
        </div>
        
        ${isAnswered ? `
          <div class="mt-5 p-4 rounded-xl ${ans.correct ? 'bg-emerald-500/10 border border-emerald-500/20' : 'bg-rose-500/10 border border-rose-500/20'}">
            <p class="text-sm font-medium ${ans.correct ? 'text-emerald-400' : 'text-rose-400'} mb-1">${ans.correct ? '✅ Benar!' : '❌ Salah!'}</p>
            <p class="text-slate-400 text-sm">${q.penjelasan}</p>
          </div>
          <button id="btnNext" class="w-full mt-4 btn-primary py-3 rounded-xl font-semibold text-white">
            ${idx < 2 ? 'Soal Berikutnya →' : 'Lihat Hasil'}
          </button>
        ` : ''}
      </div>
    </div>
  `;
}

  const btnBack = document.getElementById('btnBack');
  if (btnBack) {
    btnBack.onclick = () => {
      appState.page = 'dashboard';
      saveState();
      renderApp();
    };
  }
  
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      appState.activeTab = tab;
      saveState();
      document.getElementById('tabContent').innerHTML = renderTabContent(tab);
      if (tab === 'studi') {
        setTimeout(() => hljs.highlightAll(), 10);
        attachCodeEditorEvents();
      }
      if (tab === 'latihan') {
        attachQuizEvents();
      }

    }
  }
}

function attachCodeEditorEvents() {
  const btnRun = document.getElementById('btnRunCode');
  const btnClear = document.getElementById('btnClearCode');
  const btnReset = document.getElementById('btnResetCode');
  const btnClearOut = document.getElementById('btnClearOutput');
  const editor = document.getElementById('codeEditor');
  const outputDiv = document.getElementById('codeOutput');
  const outputContent = document.getElementById('codeOutputContent');
  const checkResult = document.getElementById('codeCheckResult');
  
  if (!btnRun || !editor) return;
  editor.value = Object.prototype.hasOwnProperty.call(appState.draftCode, appState.currentTopic)
    ? appState.draftCode[appState.currentTopic]
    : editor.value;
  editor.addEventListener('input', () => {
    appState.draftCode[appState.currentTopic] = editor.value;
    saveState();
  });
  
  btnRun.onclick = () => {
    const code = editor.value.trim();
    if (!code) {
      showToast('⚠️ Tulis kode dulu ya!', 'warning');
      return;
    }

    // Proteksi infinite loop sederhana
    if (/while\s*\(\s*true\s*\)/.test(code) || /for\s*\(\s*;\s*;\s*\)/.test(code)) {
      showToast('⚠️ Terdeteksi potensi infinite loop. Periksa kodemu!', 'warning');
      if (checkResult) {
        checkResult.classList.remove('hidden');
        checkResult.innerHTML = `
          <div class="bg-amber-500/10 border border-amber-500/30 rounded-xl p-4">
            <p class="text-amber-400 font-bold mb-1">⚠️ Infinite loop terdeteksi</p>
            <p class="text-slate-400 text-sm">Kode kamu mengandung <code>while(true)</code> atau <code>for(;;)</code>. Pastikan ada kondisi berhenti agar browser tidak hang.</p>
          </div>
        `;
      }
      return;
    }
    
    let logs = [];
    const originalLog = console.log;
    const originalError = console.error;
    const originalWarn = console.warn;
    
    console.log = (...args) => {
      logs.push(args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' '));
    };
    console.error = (...args) => {
      logs.push('[ERROR] ' + args.map(a => String(a)).join(' '));
    };
    console.warn = (...args) => {
      logs.push('[WARN] ' + args.map(a => String(a)).join(' '));
    };
    
    try {
      const result = eval(code);
      if (result !== undefined && logs.length === 0) {
        logs.push(typeof result === 'object' ? JSON.stringify(result, null, 2) : String(result));
      }
    } catch (err) {
      logs.push('[ERROR] ' + err.message);
    } finally {
      console.log = originalLog;
      console.error = originalError;
      console.warn = originalWarn;
    }
    
    outputDiv.classList.remove('hidden');
    outputContent.textContent = logs.length > 0 ? logs.join('\n') : '(tidak ada output)';
    
    // === Penilaian dengan rubrik ===
    const skor = nilaiKoding(appState.currentTopic, code, logs);
    
    if (checkResult) {
      checkResult.classList.remove('hidden');
      const colorBorder = skor.lulus ? 'border-emerald-500/30' : 'border-rose-500/30';
      const colorBg = skor.lulus ? 'bg-emerald-500/10' : 'bg-rose-500/10';
      const colorText = skor.lulus ? 'text-emerald-400' : 'text-rose-400';
      const icon = skor.lulus ? '🎉' : '😅';
      const heading = skor.lulus ? 'Selamat! Tantangan koding berhasil!' : 'Belum lulus, coba lagi ya!';
      
      const catatanHtml = skor.catatan.map(c => {
        const cls = c.status === 'ok' ? 'text-emerald-400' : c.status === 'warn' ? 'text-amber-400' : 'text-rose-400';
        const ic = c.status === 'ok' ? '✅' : c.status === 'warn' ? '⚠️' : '❌';
        return `<li class="${cls} text-sm">${ic} ${c.pesan}</li>`;
      }).join('');
      
      checkResult.innerHTML = `
        <div class="${colorBg} border ${colorBorder} rounded-xl p-4">
          <div class="flex items-center justify-between mb-2">
            <p class="${colorText} font-bold">${icon} ${heading}</p>
            <p class="text-white font-bold text-lg">${skor.total} / 100</p>
          </div>
          <div class="grid grid-cols-3 gap-2 my-3 text-center">
            <div class="bg-slate-800/60 rounded-lg p-2">
              <p class="text-xs text-slate-400">Output</p>
              <p class="font-bold text-sky-400">${skor.output}/50</p>
            </div>
            <div class="bg-slate-800/60 rounded-lg p-2">
              <p class="text-xs text-slate-400">Konsep</p>
              <p class="font-bold text-purple-400">${skor.konsep}/30</p>
            </div>
            <div class="bg-slate-800/60 rounded-lg p-2">
              <p class="text-xs text-slate-400">Anti-Hardcode</p>
              <p class="font-bold text-amber-400">${skor.kualitas}/20</p>
            </div>
          </div>
          <ul class="space-y-1 mt-2">${catatanHtml}</ul>
        </div>
      `;
      
      if (skor.lulus) {
        showToast('🎉 Tantangan koding lulus! Skor: ' + skor.total + '/100', 'success');
      } else {
        showToast('❌ Skor: ' + skor.total + '/100. Perbaiki kode dan coba lagi!', 'error');
      }
    }
  };
  
  if (btnClear) {
    btnClear.onclick = () => {
      editor.value = '';
      appState.draftCode[appState.currentTopic] = '';
      saveState();
      if (outputDiv) outputDiv.classList.add('hidden');
      if (checkResult) checkResult.classList.add('hidden');
    };
  }
  
  if (btnReset) {
    btnReset.onclick = () => {
      const topic = materiTopik[appState.currentTopic];
      editor.value = topic.latihanKoding.starterCode;
      appState.draftCode[appState.currentTopic] = editor.value;
      saveState();
      if (outputDiv) outputDiv.classList.add('hidden');
      if (checkResult) checkResult.classList.add('hidden');
      showToast('🔄 Kode direset ke awal!', 'info');
    };
  }
  
  if (btnClearOut) {
    btnClearOut.onclick = () => {
      if (outputContent) outputContent.textContent = '';
      if (outputDiv) outputDiv.classList.add('hidden');
      if (checkResult) checkResult.classList.add('hidden');
    };
  }
}

function attachQuizEvents() {
  document.querySelectorAll('.option-btn[data-opt]').forEach(btn => {
    btn.onclick = () => {
      const optIdx = parseInt(btn.dataset.opt);
      const q = appState.currentQuestions[appState.currentQuestionIndex];
      const correct = optIdx === q.jawaban;
      appState.currentAnswers[appState.currentQuestionIndex] = {
        selected: optIdx,
        correct: correct,
        penjelasan: q.penjelasan
      };
      recordAttemptIfComplete();
      
      document.getElementById('tabContent').innerHTML = renderQuizContent();
      attachQuizEvents();
      
      if (correct) {
        showToast('✅ Benar! ' + q.penjelasan.substring(0, 50) + '...', 'success');
      } else {
        showToast('❌ Salah. ' + q.penjelasan.substring(0, 50) + '...', 'error');
      }
    };
  });
  
  const btnNext = document.getElementById('btnNext');
  if (btnNext) {
    btnNext.onclick = () => {
      if (appState.currentQuestionIndex < 2) {
        appState.currentQuestionIndex++;
        saveState();
        document.getElementById('tabContent').innerHTML = renderQuizContent();
        attachQuizEvents();
      } else {
        document.getElementById('tabContent').innerHTML = renderQuizContent();
        attachQuizEvents();
      }
    };
  }
  
  const btnComplete = document.getElementById('btnComplete');
  if (btnComplete) {
    btnComplete.onclick = () => {
      const allThreeCorrect = Array.isArray(appState.currentAnswers) &&
        appState.currentAnswers.length === 3 &&
        appState.currentAnswers.every(answer => answer !== null && answer.correct === true);
      if (!allThreeCorrect) {
        showToast('🔒 Kamu harus menjawab semua soal dengan benar untuk melanjutkan.', 'warning');
        return;
      }
      const attempt = appState.currentAttempt;
      const existing = appState.progress[appState.currentTopic] || {};
      const latest = Array.isArray(existing.attemptHistory) ? existing.attemptHistory.find(item => item.attempt === attempt) : null;
      const score = latest ? latest.score : Math.max(0, getAttemptBasePoints(attempt));
      appState.progress[appState.currentTopic] = {
        ...existing,
        completed: true,
        correct: 3,
        wrong: 0,
        total: 3,
        attempts: attempt,
        score: score,
        attemptHistory: Array.isArray(existing.attemptHistory) ? existing.attemptHistory : []
      };
      saveState();
      
      if (appState.currentTopic < 9) {
        showToast('🎉 Topik ' + appState.currentTopic + ' selesai! +' + score + ' poin!', 'success');
        appState.page = 'dashboard';
        saveState();
        renderApp();
      } else {
        showToast('🏆 Semua topik selesai! Lihat hasilmu.', 'success');
        appState.page = 'result';
        saveState();
        renderApp();
      }
    };
  }
  
  const btnRetry = document.getElementById('btnRetry');
  if (btnRetry) {
    btnRetry.onclick = () => {
      appState.currentAttempt += 1;
      const existing = appState.progress[appState.currentTopic] || { completed: false, attemptHistory: [] };
      appState.progress[appState.currentTopic] = { ...existing, attempts: appState.currentAttempt };
      appState.currentQuestions = getRandomQuestions(appState.currentTopic);
      appState.currentAnswers = new Array(3).fill(null);
      appState.currentQuestionIndex = 0;
      saveState();
      document.getElementById('tabContent').innerHTML = renderQuizContent();
      attachQuizEvents();
      showToast('🔄 Soal diacak ulang. Semangat!', 'info');
    };
  }
}

function renderResult() {
  const completed = getCompletedCount();
  const totalCorrect = Object.values(appState.progress).reduce((sum, p) => sum + (p.correct || 0), 0);
  const MAX_SOAL = 27;
  const persen = Math.round((totalCorrect / MAX_SOAL) * 100);
  const predikat = getPredikat(persen);
  const totalScore = Object.values(appState.progress).reduce((sum, p) => sum + (p.score || 0), 0);
  const maxPossibleScore = completed * 100;
  const scorePercent = maxPossibleScore > 0 ? Math.round((totalScore / maxPossibleScore) * 100) : 0;
  
  let tableRows = '';
  for (let i = 1; i <= 9; i++) {
    const p = appState.progress[i];
    const isDone = p && p.completed;
    tableRows += `
      <tr class="border-b border-slate-700/50">
        <td class="py-3 px-4 text-slate-300">${i}</td>
        <td class="py-3 px-4 text-white font-medium">${materiTopik[i].judul}</td>
        <td class="py-3 px-4 text-center ${isDone ? 'text-emerald-400' : 'text-slate-500'}">${isDone ? (p.correct ?? 3) : '-'} </td>
        <td class="py-3 px-4 text-center text-rose-400">${isDone ? (p.wrong ?? 0) : '-'}</td>
        <td class="py-3 px-4 text-center text-slate-400">${p ? (p.attempts || 0) : '-'}</td>
        <td class="py-3 px-4 text-center ${isDone ? 'text-amber-400 font-bold' : 'text-slate-500'}">${isDone ? (p.score || 0) : '-'}</td>
        <td class="py-3 px-4 text-center">
          <span class="px-2 py-1 rounded-lg text-xs font-semibold ${isDone ? 'bg-emerald-500/10 text-emerald-400' : 'bg-slate-700 text-slate-400'}">
            ${isDone ? 'LULUS' : 'BELUM'}
          </span>
        </td>
      </tr>
    `;
  }
  
  return `
    <div class="min-h-screen p-4 md:p-8">
      <div class="max-w-3xl mx-auto">
        <div class="glass-card rounded-2xl p-6 md:p-8 text-center mb-6 fade-in">
          <div class="text-6xl mb-4">🏆</div>
          <h2 class="text-3xl font-bold text-white mb-2">Selamat, ${appState.user.nama}!</h2>

                    <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: left;">Topik</th>
                    <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: center;">Benar</th>
                    <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: center;">Salah</th>
                    <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: center;">Percobaan</th>
                    <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: center;">Poin</th>
                    <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: center;">Status</th>

                  ${Object.keys(materiTopik).map(i => {

                      <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: center;">${i}</td>

            <div style="margin-bottom: 24px;">
              <h3 style="font-size: 14px; color: #0ea5e9; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;">Riwayat Percobaan</h3>
              <table style="width: 100%; border-collapse: collapse; font-size: 11px;">
                <thead><tr style="background: #f1f5f9;"><th style="border: 1px solid #cbd5e1; padding: 6px;">Topik</th><th style="border: 1px solid #cbd5e1; padding: 6px;">Percobaan</th><th style="border: 1px solid #cbd5e1; padding: 6px;">Benar</th><th style="border: 1px solid #cbd5e1; padding: 6px;">Salah</th><th style="border: 1px solid #cbd5e1; padding: 6px;">Nilai</th></tr></thead>

              <p>SMK _________________________</p>

        <!-- Score Table (visible) -->

}

function attachResultEvents() {
  document.getElementById('btnBackDashboard').onclick = () => {
    appState.page = 'dashboard';
    saveState();
    renderApp();
  };
  
  document.getElementById('btnDownloadPDF').onclick = async () => {
    const pdfContent = document.getElementById('pdfContent');
    const element = pdfContent && pdfContent.firstElementChild;
    if (!pdfContent || !element) {
      showToast('❌ Konten laporan PDF tidak ditemukan.', 'error');
      return;
    }
    const filename = `HasilBelajar_${(appState.user?.nama || 'Siswa').replace(/[^a-z0-9_-]/gi, '_')}_${new Date().toISOString().split('T')[0]}.pdf`;
    const opt = {
      margin: 10,
      filename,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'] }
    };

    const oldDisplay = pdfContent.style.display;
    try {
      pdfContent.style.display = 'block';
      pdfContent.style.position = 'absolute';
      pdfContent.style.left = '0';
      pdfContent.style.top = '0';
      pdfContent.style.width = '800px';
      pdfContent.style.zIndex = '-1';
      if (typeof window.html2pdf === 'function') {
        await window.html2pdf().set(opt).from(element).save();
        showToast('📄 Laporan PDF berhasil dibuat. Periksa folder Unduhan.', 'success');
      } else {
        throw new Error('Library html2pdf tidak tersedia');
      }
    } catch (err) {
      console.error('PDF download error:', err);
      try {
        const printWindow = window.open('', '_blank');
        if (!printWindow) throw new Error('Popup diblokir browser');
        printWindow.document.open();
        printWindow.document.write(`<!doctype html><html lang="id"><head><meta charset="utf-8"><title>${filename}</title><style>body{font-family:Arial,sans-serif;color:#222;margin:20mm}table{width:100%;border-collapse:collapse}td,th{padding:7px;border:1px solid #ccc;text-align:left}h1,h2,h3{color:#0f172a} @media print{button{display:none}}</style></head><body>${element.innerHTML}<script>window.onload=function(){setTimeout(function(){window.print()},300)};<\/script></body></html>`);
        printWindow.document.close();
        showToast('PDF otomatis gagal. Pilih "Save as PDF" pada jendela cetak.', 'warning');
      } catch (printErr) {
        showToast('❌ PDF gagal. Izinkan pop-up atau coba browser Chrome/Edge.', 'error');
        console.error('Print fallback error:', printErr);
      }
    } finally {
      // Restore dengan cara yang lebih aman
      pdfContent.style.display = oldDisplay;
      pdfContent.style.position = '';
      pdfContent.style.left = '';
      pdfContent.style.top = '';
      pdfContent.style.width = '';
      pdfContent.style.zIndex = '';
      if (oldDisplay === 'none' || oldDisplay === '') {
        pdfContent.setAttribute('style', 'display:none;');
      }
    }
  };
  
  createConfetti();
}

function createConfetti() {
  const colors = ['#0ea5e9', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'];
  for (let i = 0; i < 50; i++) {
    setTimeout(() => {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * 100 + 'vw';
      confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
      confetti.style.animationDuration = (2 + Math.random() * 2) + 's';
      document.body.appendChild(confetti);
      setTimeout(() => confetti.remove(), 4000);
    }, i * 50);
  }
}

window.addEventListener('pagehide', saveState);
loadState();
renderApp();
</script>
